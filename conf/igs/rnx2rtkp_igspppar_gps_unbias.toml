# MRTKLIB Configuration (TOML v1.0.0)
# IGS-products PPP-AR, GPS-only, with drop_uncorrected_code enabled (#263).
#
# Identical to rnx2rtkp_igspppar_gps_recvbias.toml but with
# positioning.ppp.drop_uncorrected_code = true (pos2-uncorrbias / opt->unbias).
# The bias-sinex fixture gives every satellite/code used in this window a
# receiver-level OSB (satellite-specific for G03, system-wide GPS for the
# rest), so the gate should never trigger a drop here -- this locks in that
# turning the flag on does not regress accuracy when coverage is complete,
# and exercises the corr_meas() unbias branches end to end (see #263).

[positioning]
mode = "ppp-static"
frequency = "l1+2"
solution_type = "forward"
elevation_mask = 15.0
dynamics = false
satellite_ephemeris = "precise"
systems = ["GPS"]
correction = "igs"

[positioning.corrections]
satellite_antenna = true
receiver_antenna = true
phase_windup = "on"
tidal_correction = "on"

[positioning.atmosphere]
ionosphere = "est-stec"     # uncombined (IONOOPT_EST) -- required for PPP-AR
troposphere = "est-ztdgrad"

[ambiguity_resolution]
mode = "continuous"
systems = 1         # GPS only

[ambiguity_resolution.thresholds]
ratio = 2.0
ratio1 = 1.5
elevation_mask = 15.0

[ambiguity_resolution.counters]
min_fix = 10
max_iterations = 10

[rejection]
innovation = 30.0

[slip_detection]
threshold = 0.05

[kalman_filter]
iterations = 1

[kalman_filter.measurement_error]
phase = 0.003
phase_elevation = 0.003

[kalman_filter.initial_std]
bias = 30.0
ionosphere = 0.3
troposphere = 0.3

[kalman_filter.process_noise]
bias = 0.0001
ionosphere = 0.01
troposphere = 0.0001

[output]
format = "llh"
height_type = "ellipsoidal"
static_solution = "all"

[files]
satellite_atx = "./tests/data/igs/igs20_trim.atx"
receiver_atx = "./tests/data/igs/igs20_trim.atx"
bias_sinex = "./tests/data/igs/COD0MGXFIN_2026021_01D_OSB_recvbias.BIA"

[positioning.ppp]
max_bias_dt = 86400
drop_uncorrected_code = true

[positioning.relative]
max_age = 30.0
