# MRTKLIB benchmark receiver configuration: UrbanNav Tokyo u-blox F9P rover
#
# Layered on rtk.toml + urbannav.toml for the two F9P cases only; it replaces
# rtk.toml's signal list with the F9P's own signals (RINEX 3.02: GPS/QZS L1C +
# L2L, Galileo E1C + E7Q, BeiDou B1I + B2I).
#
# Why: rtk.toml's list (GPS L2W, Galileo E5a) does not match the F9P. A
# configured code the rover does not track drops that band for the rover, so
# with rtk.toml's list the F9P cases run on L1 for most satellites and score
# poorly (UrbanNav score odaiba 37.7 %, shinjuku 12.5 %; misfix3d, integer-fixed
# epochs with 3D error > 0.5 m, 23 % / 55 %). The base (NetR9)
# does not track L2L, so GPS / QZS RTK on these cases uses L1 only even with
# this list; it is not meant as a tuned setting. Remove this file once RTK
# falls back to an available code of the band (#193).
#
# Before #577 the RTK SPP seed used the ionosphere-free combination and the F9P
# produced no solution at all with rtk.toml's list or with no list.

[positioning]
signals = ["G1C", "G2L", "E1C", "E7Q", "J1C", "J2L", "C2I", "C7I"]
